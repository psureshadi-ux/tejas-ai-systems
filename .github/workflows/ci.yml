name: Tejas AI Systems CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Test Suite
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://tejasai.vercel.app"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_mock"
          RAZORPAY_KEY_SECRET: "mock_secret"
          RAZORPAY_WEBHOOK_SECRET: "mock_webhook_secret"
